  <style>
    :root{font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#24212B;background:#F4EEE2;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;background-image:radial-gradient(#77694c20 .6px,transparent .6px);background-size:5px 5px}
    main{min-height:100vh;min-height:100dvh;max-width:1200px;margin:auto;padding:48px 32px;display:flex;flex-direction:column;justify-content:center;gap:40px}
    h1{margin:0;text-align:center;font-size:clamp(32px,4.4vw,60px);font-weight:900;letter-spacing:-.05em;line-height:1.15;white-space:nowrap}
    .games{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px}
    .game{display:flex;flex-direction:column;color:inherit;text-decoration:none;background:#FFFDF8;border:2px solid #E1D7C5;border-radius:32px;overflow:hidden;box-shadow:0 8px 0 #DAD0BE,0 18px 35px #24212B0C;touch-action:manipulation;transition:transform .18s,box-shadow .18s}
    .game:hover{transform:translateY(-5px);box-shadow:0 13px 0 #DAD0BE,0 22px 40px #24212B14}.game:active{transform:translateY(6px);box-shadow:0 2px 0 #DAD0BE}.game:focus-visible{outline:5px solid #AD750D;outline-offset:6px}
    .cover{width:100%;height:auto;aspect-ratio:16/10;display:block;object-fit:cover;background:#E6EFE6}.buildings{padding:28px 16px;background:radial-gradient(ellipse at 50% 35%,#FFFDF8,#E6EFE6)}
    .caption{padding:26px 28px 30px;display:grid;grid-template-columns:1fr 48px;gap:10px 16px;align-items:center}.caption h2{margin:0;font-size:clamp(28px,2.7vw,38px);letter-spacing:-.045em;line-height:1.2;word-break:keep-all}.caption p{margin:0;font-size:24px;font-weight:600;color:#5B5566;grid-column:1}.arrow{grid-column:2;grid-row:1/3;width:48px;height:48px;display:grid;place-items:center;border-radius:50%;background:#F0E9DC;font-size:30px}
    @media(orientation:portrait){main{max-width:720px;padding:40px 36px;gap:32px}.games{grid-template-columns:1fr;gap:28px}.cover{aspect-ratio:2.6}.buildings{padding:14px 30px}.caption{padding:22px 26px}.caption h2{font-size:34px}.caption p{font-size:24px}}
    @media(max-width:600px){main{padding:32px 20px;gap:28px}.games{gap:24px}.game{border-radius:24px}.cover{aspect-ratio:1.85}.buildings{padding:18px 10px}.caption{padding:20px;grid-template-columns:1fr 40px;gap:8px 10px}.caption h2{font-size:28px}.caption p{font-size:21px}.arrow{width:40px;height:40px;font-size:26px}}
    .guide-link{align-self:center;color:inherit;text-decoration:none;font-size:24px;font-weight:800;background:#FFFDF8;border:2px solid #E1D7C5;border-radius:999px;padding:12px 28px;box-shadow:0 5px 0 #DAD0BE}.guide-link:hover{transform:translateY(-2px)}
    @media(prefers-reduced-motion:reduce){.game{transition:none}}
    .game.soon{cursor:default}.game.soon:hover,.game.soon:active{transform:none;box-shadow:0 8px 0 #DAD0BE,0 18px 35px #24212B0C}.game.soon .cover{filter:grayscale(.7);opacity:.75}.game.soon .caption{grid-template-columns:1fr auto}.game.soon .badge{grid-column:2;grid-row:1/3;padding:8px 12px;border-radius:999px;background:#F0E9DC;font-size:18px;font-weight:800;white-space:nowrap}
  </style>
